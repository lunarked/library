<!DOCTYPE html>
<html lang="en" data-look="sheet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advertising Workbook</title>
<meta name="description" content="Plan campaign structure and budget, track weekly ACoS and TACoS against break-even, harvest search terms, and set bids from your margin.">
<style>


:root{
  /* Layout: a compact product header with launch status, then a four-tab workbook.
     Tinted cells are inputs and everything else is calculated. The content leads: one text face, hairlines, one accent.
     The other two themes (sheet, label) swap these tokens and a few layout rules. */
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1B1F27; --ink-2:#4A5261; --muted:#677082; --line:#E2E6EC;
  --accent:#2456C9; --on-accent:#FFFFFF; --field:#F3F5F9; --field-line:#D5DBE5; --series:#2F6BDB; --track:#E1E7F2;
  --good:#0B6B34; --good-bg:#DCF2E3; --warn:#7A4E00; --warn-bg:#FFEDBF; --bad:#A3201B; --bad-bg:#FBDDDB; --idle:#556072; --idle-bg:#E9ECF1;
  --btn-line:#CBD2DC; --note-bg:#EEF3FD; --note-fg:#33415C; --note-line:#D5E0F7;
  --top-bg:transparent; --top-fg:var(--ink); --top-muted:var(--muted); --top-pad:0px; --top-focus:var(--accent);
  --band-bg:transparent; --band-fg:var(--ink); --head-fill:transparent;
  --radius:6px; --radius-in:4px; --rule:1px solid var(--btn-line); --in-border:1px solid var(--field-line); --in-bottom:1px solid var(--field-line);
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --font-display:var(--font-body); --font-num:var(--font-body);
  --cap:500 12px/1.3 var(--font-body); --cap-case:none; --cap-track:0em;
  --h1:600 18px/1.2 var(--font-display); --tab:500 14px/1.1 var(--font-display); --head-case:none; --head-track:0em;
  --h2:600 16px/1.25 var(--font-display); --h2-case:none; --h2-track:0em;
  --linput:500 14.5px/1.3 var(--font-body); --big:600 22px/1.1 var(--font-body);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1115; --surface:#171A20; --ink:#E9ECF1; --ink-2:#B4BBC7; --muted:#8B93A1; --line:#2A2F38;
    --accent:#8FB0FF; --on-accent:#0F1115; --field:#1F242C; --field-line:#363D48; --series:#6C88F5; --track:#2A3344;
    --good:#6FD99A; --good-bg:#10301E; --warn:#F3C45A; --warn-bg:#382A06; --bad:#FF938A; --bad-bg:#3A1614; --idle:#A3ACBB; --idle-bg:#202632;
    --btn-line:#3A414D; --note-bg:#18202F; --note-fg:#B9C4D9; --note-line:#2A3650;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#171A20; --ink:#E9ECF1; --ink-2:#B4BBC7; --muted:#8B93A1; --line:#2A2F38;
  --accent:#8FB0FF; --on-accent:#0F1115; --field:#1F242C; --field-line:#363D48; --series:#6C88F5; --track:#2A3344;
  --good:#6FD99A; --good-bg:#10301E; --warn:#F3C45A; --warn-bg:#382A06; --bad:#FF938A; --bad-bg:#3A1614; --idle:#A3ACBB; --idle-bg:#202632;
  --btn-line:#3A414D; --note-bg:#18202F; --note-fg:#B9C4D9; --note-line:#2A3650;
  color-scheme:dark;
}

/* theme: spreadsheet */
:root[data-look="sheet"]{
  --bg:#F1F3F4; --surface:#FFFFFF; --ink:#1F2328; --ink-2:#444B54; --muted:#5F6672; --line:#D9DEE3;
  --accent:#0F766E; --on-accent:#FFFFFF; --field:#FFF8E1; --field-line:#E3D5A3; --series:#12968A; --track:#CFE8E4;
  --btn-line:#BFC6CE; --note-bg:#FFF8E1; --note-fg:#5C4A00; --note-line:#E3D5A3;
  --top-bg:#1B2A41; --top-fg:#FFFFFF; --top-muted:#C3CEDD; --top-pad:10px 14px; --top-focus:#FFFFFF;
  --band-bg:#0F766E; --band-fg:#FFFFFF; --head-fill:#E6F2F1;
  --radius:0px; --radius-in:0px; --rule:1px solid var(--line);
  --font-body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --cap:700 11.5px/1.3 var(--font-body);
  --h1:700 17px/1.2 var(--font-display); --tab:700 13px/1.1 var(--font-display);
  --h2:700 12.5px/1.2 var(--font-display); --h2-case:uppercase; --h2-track:.03em;
}
@media (prefers-color-scheme: dark){
  :root[data-look="sheet"]:not([data-theme="light"]){
    --bg:#101314; --surface:#191D1F; --ink:#E8EAED; --ink-2:#BDC1C6; --muted:#979DA4; --line:#30373B;
    --accent:#5EC4B8; --on-accent:#08211E; --field:#2B2817; --field-line:#57502C; --series:#2FA094; --track:#1D3A36;
    --btn-line:#414A50; --note-bg:#2B2817; --note-fg:#E5D48A; --note-line:#57502C;
    --top-bg:#0E1826; --top-fg:#E8EAED; --top-muted:#9FB0C6; --top-focus:#E8EAED;
    --band-bg:#134E48; --band-fg:#E8F5F3; --head-fill:#1E2A2A;
  }
}
:root[data-look="sheet"][data-theme="dark"]{
  --bg:#101314; --surface:#191D1F; --ink:#E8EAED; --ink-2:#BDC1C6; --muted:#979DA4; --line:#30373B;
  --accent:#5EC4B8; --on-accent:#08211E; --field:#2B2817; --field-line:#57502C; --series:#2FA094; --track:#1D3A36;
  --btn-line:#414A50; --note-bg:#2B2817; --note-fg:#E5D48A; --note-line:#57502C;
  --top-bg:#0E1826; --top-fg:#E8EAED; --top-muted:#9FB0C6; --top-focus:#E8EAED;
  --band-bg:#134E48; --band-fg:#E8F5F3; --head-fill:#1E2A2A;
}

/* theme: shipping label */
:root[data-look="label"]{
  --bg:#E7EAF0; --surface:#FFFFFF; --ink:#0F1320; --ink-2:#434B5C; --muted:#5C6578; --line:#D5DAE3;
  --accent:#1D3FD0; --on-accent:#FFFFFF; --field:#E8EDFF; --field-line:#AAB8F0; --series:#3156E0; --track:#D6DEFA;
  --btn-line:var(--ink); --note-bg:var(--warn-bg); --note-fg:var(--warn); --note-line:transparent;
  --label-paper:#FAFAF6; --label-ink:#0B0D12; --label-muted:#5A6272; --label-field:#E6EBFF; --label-accent:#1D3FD0; --label-track:#D3DBF7;
  --radius:0px; --radius-in:0px; --rule:1.5px solid var(--ink); --in-border:0px solid transparent; --in-bottom:1.5px solid var(--field-line);
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cap:500 10.5px/1.25 var(--font-num); --cap-case:uppercase; --cap-track:.13em;
  --h1:800 34px/1 var(--font-display); --tab:700 21px/1 var(--font-display); --head-case:uppercase; --head-track:.045em;
  --h2:700 25px/1 var(--font-display); --h2-case:uppercase; --h2-track:.045em;
  --linput:600 17px/1.25 var(--font-body); --big:600 28px/1 var(--font-body);
}
@media (prefers-color-scheme: dark){
  :root[data-look="label"]:not([data-theme="light"]){
    --bg:#0C0F15; --surface:#141922; --ink:#ECEFF5; --ink-2:#B9C0CD; --muted:#8D96A8; --line:#283040;
    --accent:#9BB0FF; --on-accent:#0C0F15; --field:#1A2342; --field-line:#3A4A85; --series:#6C88F5; --track:#232C4D;
    --btn-line:var(--ink); --note-bg:var(--warn-bg); --note-fg:var(--warn); --note-line:transparent;
  }
}
:root[data-look="label"][data-theme="dark"]{
  --bg:#0C0F15; --surface:#141922; --ink:#ECEFF5; --ink-2:#B9C0CD; --muted:#8D96A8; --line:#283040;
  --accent:#9BB0FF; --on-accent:#0C0F15; --field:#1A2342; --field-line:#3A4A85; --series:#6C88F5; --track:#232C4D;
  --btn-line:var(--ink); --note-bg:var(--warn-bg); --note-fg:var(--warn); --note-line:transparent;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 64px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-top:16px;padding:var(--top-pad);background:var(--top-bg);color:var(--top-fg)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:var(--h1);letter-spacing:var(--head-track);text-transform:var(--head-case);margin:0}
.brand span{font:var(--cap);letter-spacing:var(--cap-track);text-transform:var(--cap-case);color:var(--top-muted)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.save,.look{font:400 12.5px/1.2 var(--font-body);color:var(--top-muted);display:flex;align-items:center;gap:7px}
.save{margin-right:6px}
.save::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.save[data-mode="off"]::before{background:var(--bad);border-radius:0;transform:rotate(45deg)}
.btn,.look select{font:500 13px/1 var(--font-body);padding:8px 12px;border:1px solid var(--btn-line);background-color:var(--surface);color:var(--ink);border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.btn:hover,.look select:hover{border-color:var(--ink-2)}
.btn.primary{background-color:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background-color:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.quiet{background-color:transparent;color:var(--ink-2)}
.btn.small{padding:6px 10px;font-size:12.5px}
.look select{appearance:none;-webkit-appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
:is(.btn,.tab,.in,.linput,.del,.link,svg,.look select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top :is(.btn,select):focus-visible{outline-color:var(--top-focus)}

/* product header */
.label{display:grid;grid-template-columns:minmax(0,1fr) 310px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.cap,.field label{display:block;font:var(--cap);letter-spacing:var(--cap-track);text-transform:var(--cap-case);color:var(--muted)}
.lcell{min-width:0}
.lcell .cap{margin-bottom:5px}
.linput{display:block;width:100%;min-width:0;font:var(--linput);color:var(--ink);background:var(--field);border:var(--in-border);border-bottom:var(--in-bottom);padding:6px 9px;border-radius:var(--radius-in)}
.linput:hover{border-color:var(--muted)}
.linput::placeholder{color:var(--muted);font-weight:400}
.barcode,.barcode-text{display:none}
.count{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.count strong{font:var(--big);letter-spacing:-.01em}
.count span{font:400 13.5px/1.25 var(--font-body);color:var(--ink-2)}
.count-date{font:400 12.5px/1.3 var(--font-num);color:var(--muted);margin-top:4px;min-height:1.3em}
.meters{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.meters li{display:grid;grid-template-columns:108px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px;line-height:1.2}
.meters b{font:500 12.5px/1 var(--font-num);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .18s ease}
.meter.thin{height:4px;border-radius:2px}
.meter.thin i{border-radius:2px}
.meter[data-tone="bad"]{background:var(--bad-bg)}
.meter[data-tone="bad"] i{background:var(--bad)}
:root:not([data-look="label"]) .label-main{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 16px;padding:16px;align-content:start;min-width:0}
:root:not([data-look="label"]) :is(.lrow,.meta){display:contents}
:root:not([data-look="label"]) .lrow-id > .lcell:first-child{grid-column:span 3}
:root:not([data-look="label"]) .lrow-id > .lcell:last-child{grid-column:span 6}
:root:not([data-look="label"]) .lrow-sku > .lcell:first-child{grid-column:span 3}
:root:not([data-look="label"]) .meta > div{grid-column:span 4;min-width:0}
:root:not([data-look="label"]) .label-main{grid-column:1;grid-row:1}
:root:not([data-look="label"]) .label-side{display:contents}
:root:not([data-look="label"]) .label-side > .lcell:first-child{grid-column:1;grid-row:2;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 16px 12px;border-top:1px solid var(--line)}
:root:not([data-look="label"]) .label-side > .lcell:first-child .cap{margin:0}
:root:not([data-look="label"]) .label-side > .lcell:first-child .count-date{margin:0}
:root:not([data-look="label"]) .label-side > .lcell:last-child{grid-column:2;grid-row:1 / span 2;padding:16px;border-left:1px solid var(--line)}

/* sample notice */
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding:8px 12px;background:var(--note-bg);color:var(--note-fg);border:1px solid var(--note-line);border-radius:var(--radius);font-size:13.5px}
.notice p{margin:0;max-width:70ch}
.notice-actions{display:flex;gap:8px;flex-wrap:wrap}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{font:var(--tab);letter-spacing:var(--head-track);text-transform:var(--head-case);padding:11px 12px;color:var(--ink-2);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tab small{font:500 11.5px/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;padding:3px 7px;border-radius:10px;background:var(--idle-bg);color:var(--idle)}
.tab small:empty{display:none}

/* panels and sections */
.panel{display:flex;flex-direction:column;gap:14px}
.sec{--pad:clamp(14px,2vw,20px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;flex-direction:column;gap:4px}
.sec h2{font:var(--h2);letter-spacing:var(--h2-track);text-transform:var(--h2-case);color:var(--band-fg);margin:0;text-wrap:balance}
.help{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.5;max-width:72ch}
.strip{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px}
.field .in{max-width:230px}
.field small{font-size:12px;color:var(--ink-2)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px;align-items:start}
.form .field{min-width:0}
.form .field .in{max-width:none}
.stat{display:flex;flex-direction:column;gap:5px;min-width:120px}
.stat strong{font:600 18px/1.2 var(--font-body);display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:33px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* inputs */
.in{display:block;width:100%;min-width:0;font:400 14px/1.4 var(--font-body);color:var(--ink);background:var(--field);border:var(--in-border);border-bottom:var(--in-bottom);padding:6px 8px;border-radius:var(--radius-in)}
.in:hover{border-color:var(--muted)}
.in::placeholder{color:var(--muted)}
.in.num{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.in.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
textarea.in{resize:vertical;min-height:36px;line-height:1.45}
select.in{appearance:none;-webkit-appearance:none;padding-right:24px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.in[data-tone]{font-weight:600;border-color:transparent}
select.in[data-tone="good"]{background-color:var(--good-bg);color:var(--good)}
select.in[data-tone="warn"]{background-color:var(--warn-bg);color:var(--warn)}
select.in[data-tone="bad"]{background-color:var(--bad-bg);color:var(--bad)}
select.in[data-tone="idle"]{background-color:var(--idle-bg);color:var(--idle)}
select.in option{background:var(--surface);color:var(--ink);font-weight:400}
input.in[data-tone="bad"]{color:var(--bad);font-weight:600;border-color:var(--bad)}

/* status marks */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-body);padding:5px 9px 5px 8px;border-radius:var(--radius-in);white-space:nowrap;background:var(--idle-bg);color:var(--idle)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.pill[data-tone="good"]{background:var(--good-bg);color:var(--good)}
.pill[data-tone="good"]::before{background:currentColor}
.pill[data-tone="warn"]{background:var(--warn-bg);color:var(--warn)}
.pill[data-tone="warn"]::before{background:currentColor;border-radius:1px}
.pill[data-tone="bad"]{background:var(--bad-bg);color:var(--bad)}
.pill[data-tone="bad"]::before{background:currentColor;border-radius:0;transform:rotate(45deg)}
.tier{display:inline-grid;place-items:center;min-width:28px;height:23px;padding:0 6px;font:600 12px/1 var(--font-num);border:1.5px solid var(--accent);color:var(--accent);border-radius:var(--radius-in)}
.tier[data-tier="A"]{background:var(--accent);color:var(--on-accent)}
.tier[data-tier="B"]{background:var(--track)}
.tier[data-tier="C"]{border-color:var(--line);color:var(--ink-2)}
.calc,.v{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.v[data-tone="bad"]{color:var(--bad);font-weight:600}

/* listing copy */
.copy{display:flex;flex-direction:column}
.copy-head,.copy-row{display:grid;grid-template-columns:170px minmax(0,1fr) 196px 84px 104px;gap:6px 16px;align-items:start}
.copy-head{font:var(--cap);letter-spacing:var(--cap-track);text-transform:var(--cap-case);color:var(--muted);padding-bottom:7px;border-bottom:var(--rule);background:var(--head-fill)}
.copy-row{padding:10px 0;border-bottom:1px solid var(--line)}
.copy-row:last-child{border-bottom:0;padding-bottom:0}
.copy-name label{font-weight:600;display:block;padding-top:6px}
.copy-name .hint{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.copy-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.copy-used{display:flex;align-items:center;gap:6px;white-space:nowrap}
.copy-used .v{display:inline-block;min-width:44px;text-align:right}
.copy-used .limit{width:70px;flex:none}
.copy-used .unit{font-size:12px;color:var(--muted)}
.copy-left,.copy-status{padding-top:7px}
.copy-left{font-size:13px;white-space:nowrap}

/* tables */
.scroll{overflow-x:auto;position:relative}
.grid{border-collapse:collapse;width:100%;font-size:14px}
.grid th{font:var(--cap);letter-spacing:var(--cap-track);text-transform:var(--cap-case);color:var(--muted);text-align:left;padding:7px 5px;border-bottom:var(--rule);vertical-align:bottom;background:var(--head-fill)}
.grid td{padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid th:first-child,.grid td:first-child{padding-left:0}
.grid .num{text-align:right}
.grid td.calc{white-space:nowrap}
.grid .strong{font-weight:600}
.grid td.x,.grid th.x{width:34px;padding:0 0 0 4px;text-align:right}
.grid td.empty{color:var(--ink-2);padding:18px 0;text-align:left}
.grid tfoot td{border-top:var(--rule);border-bottom:0;font-weight:600;padding-top:9px;padding-bottom:5px}
.auto-tag{font:500 10px/1 var(--font-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:var(--radius-in);padding:2px 4px;margin-left:8px;vertical-align:1px}
.del{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:19px;line-height:1;cursor:pointer;border-radius:var(--radius-in)}
.del:hover{background:var(--bad-bg);color:var(--bad)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tile{background:var(--surface);padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tile strong{font:var(--big);letter-spacing:-.01em}
.tile .sub{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.tile[data-tone="bad"] strong{color:var(--bad)}
.tile[data-tone="none"] strong{color:var(--muted);font-size:16px;line-height:24px;font-weight:500}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 32px}
.chart{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.chart figcaption{font:600 13.5px/1.35 var(--font-body)}
.chart figcaption span{display:block;font-weight:400;font-size:13px;color:var(--ink-2)}
.plot{position:relative;min-height:230px}
.plot svg{display:block;width:100%;height:230px;touch-action:pan-y}
.chart-empty{margin:0;padding:36px 0;color:var(--ink-2);font-size:14px}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-axis{stroke:var(--muted);stroke-width:1;opacity:.7}
.ch-tick{font:400 11px var(--font-num);fill:var(--muted)}
.ch-line{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--series);opacity:.1}
.ch-dot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.ch-end{font:600 12.5px var(--font-body);fill:var(--ink)}
.ch-target{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 4}
.ch-target-label{font:500 11px var(--font-num);fill:var(--ink-2)}
.ch-cross{stroke:var(--ink-2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:var(--radius-in);font-size:12px;line-height:1.3;white-space:nowrap;z-index:2}
.tip strong{display:block;font-size:13px}
.tip span{opacity:.8}

/* footer, toast, dialog */
.foot{color:var(--ink-2);font-size:12.5px;line-height:1.55;display:flex;flex-direction:column;gap:6px;max-width:80ch;padding-top:4px}
.foot p{margin:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--radius);font-size:14px;display:flex;gap:14px;align-items:center;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);padding:20px;width:100%;max-width:min(560px,calc(100vw - 32px));box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(8,10,16,.55)}
dialog h2{font:600 17px/1.25 var(--font-body);margin:0 0 10px;text-wrap:balance}
#dlg-body{display:flex;flex-direction:column;gap:10px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.err{margin:0;color:var(--bad);font-size:14px;font-weight:600}
noscript p{background:var(--bad-bg);color:var(--bad);padding:12px 14px;margin:0}

/* theme: spreadsheet, structure */
:root[data-look="sheet"] .tabs{gap:2px}
:root[data-look="sheet"] .tab{background:var(--idle-bg);border:1px solid var(--line);border-bottom:0;padding:9px 14px}
:root[data-look="sheet"] .tab[aria-selected="true"]{background:var(--surface);box-shadow:inset 0 3px 0 var(--accent)}
:root[data-look="sheet"] .tab small{border-radius:0;background:transparent;border:1px solid var(--line);color:var(--ink-2);padding:2px 5px}
:root[data-look="sheet"] .sec{padding-top:0}
:root[data-look="sheet"] .sec-head{margin:0 calc(-1 * var(--pad));gap:0}
:root[data-look="sheet"] .sec h2{background:var(--band-bg);padding:8px var(--pad)}
:root[data-look="sheet"] .sec-head .help{padding:10px var(--pad) 0}
:root[data-look="sheet"] .grid th,:root[data-look="sheet"] .grid td{border:1px solid var(--line)}
:root[data-look="sheet"] .grid th{color:var(--ink)}
:root[data-look="sheet"] .grid th:first-child,:root[data-look="sheet"] .grid td:first-child{padding-left:6px}
:root[data-look="sheet"] .grid td.x,:root[data-look="sheet"] .grid th.x{width:36px;padding:0 2px;text-align:center}
:root[data-look="sheet"] .grid tfoot td{border-top:1px solid var(--line);background:var(--head-fill)}
:root[data-look="sheet"] .copy-head{padding:7px 8px;color:var(--ink);border:1px solid var(--line)}
:root[data-look="sheet"] .copy-row{padding-left:8px;padding-right:8px}
:root[data-look="sheet"] .pill,:root[data-look="sheet"] .tier{font-weight:700}

/* theme: shipping label, structure */
:root[data-look="label"] body{font-size:15px}
:root[data-look="label"] .wrap{gap:20px}
:root[data-look="label"] .top{margin-top:22px}
:root[data-look="label"] .brand{gap:12px}
:root[data-look="label"] :is(.save,.look){font:500 12px/1.2 var(--font-num)}
:root[data-look="label"] :is(.btn,.look select){border-width:1.5px;background-color:transparent;font-size:13.5px;padding:9px 14px}
:root[data-look="label"] .look select{padding-right:28px}
:root[data-look="label"] .btn:hover{background-color:var(--ink);color:var(--surface)}
:root[data-look="label"] .btn.primary{background-color:var(--accent);border-color:var(--accent);color:var(--on-accent)}
:root[data-look="label"] .btn.primary:hover{background-color:var(--ink);border-color:var(--ink);color:var(--surface)}
:root[data-look="label"] .btn.danger{background-color:var(--bad);border-color:var(--bad);color:var(--surface)}
:root[data-look="label"] .btn.quiet{border-color:var(--line);color:var(--ink-2)}
:root[data-look="label"] .btn.quiet:hover{border-color:var(--ink);background-color:transparent;color:var(--ink)}
:root[data-look="label"] .btn.small{padding:7px 11px;font-size:13px}
:root[data-look="label"] .label{background:var(--label-paper);color:var(--label-ink);border:2px solid var(--label-ink);
  --ink:var(--label-ink);--ink-2:#2A303C;--muted:var(--label-muted);--field:var(--label-field);--field-line:#A9B6EE;--accent:var(--label-accent);--track:var(--label-track);--in-bottom:1.5px solid #A9B6EE;color-scheme:light}
:root[data-look="label"] .label-main{display:grid;grid-template-rows:auto 1fr;border-right:2px solid var(--label-ink);min-width:0}
:root[data-look="label"] .lrow{display:grid;min-width:0}
:root[data-look="label"] .lrow-id{grid-template-columns:minmax(0,1fr) minmax(0,2fr);border-bottom:2px solid var(--label-ink)}
:root[data-look="label"] .lrow-sku{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
:root[data-look="label"] .lcell{padding:14px 16px 16px}
:root[data-look="label"] .lrow > .lcell + .lcell{border-left:2px solid var(--label-ink)}
:root[data-look="label"] .label-side{display:grid;grid-template-rows:auto 1fr;min-width:0}
:root[data-look="label"] .label-side > .lcell + .lcell{border-top:2px solid var(--label-ink)}
:root[data-look="label"] .lcell .cap{margin-bottom:7px}
:root[data-look="label"] .linput{padding:6px 8px}
:root[data-look="label"] :is(.linput,.in):hover{border-color:var(--accent)}
:root[data-look="label"] .sku-input{font:800 clamp(32px,4.6vw,52px)/1.05 var(--font-display);letter-spacing:.03em;text-transform:uppercase;padding:5px 8px 3px}
:root[data-look="label"] .barcode{display:block;height:46px;margin-top:14px;max-width:100%;color:var(--label-ink)}
:root[data-look="label"] .barcode svg{display:block;width:100%;height:100%;fill:currentColor}
:root[data-look="label"] .barcode-text{display:flex;justify-content:space-between;gap:12px;margin-top:5px;font:500 11px/1.3 var(--font-num);letter-spacing:.12em;max-width:100%}
:root[data-look="label"] .barcode-text span:last-child{color:var(--muted)}
:root[data-look="label"] .meta{display:grid;gap:12px;align-content:start}
:root[data-look="label"] .meta .linput{font-size:15px}
:root[data-look="label"] .count{gap:10px}
:root[data-look="label"] .count strong{font:600 52px/1 var(--font-body);letter-spacing:-.02em}
:root[data-look="label"] .count span{font:500 14px/1.25 var(--font-body)}
:root[data-look="label"] .count-date{font-weight:500;margin-top:8px}
:root[data-look="label"] .meters{gap:9px}
:root[data-look="label"] .meters li{grid-template-columns:112px minmax(0,1fr) auto}
:root[data-look="label"] .meter{height:8px;border-radius:4px}
:root[data-look="label"] .meter i{border-radius:4px}
:root[data-look="label"] .meter.thin{height:4px;border-radius:2px}
:root[data-look="label"] .notice{border:0;border-left:4px solid var(--warn);padding:10px 14px;font-size:14px}
:root[data-look="label"] .notice .btn{border-color:currentColor;color:inherit}
:root[data-look="label"] .notice .btn:hover{background-color:var(--warn);color:var(--warn-bg)}
:root[data-look="label"] .tabs{gap:2px;border-bottom:2px solid var(--ink)}
:root[data-look="label"] .tab{padding:12px 18px 10px;gap:10px}
:root[data-look="label"] .tab:hover{box-shadow:inset 0 -3px 0 var(--line)}
:root[data-look="label"] .tab[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
:root[data-look="label"] .tab small{font:500 11px/1 var(--font-num);padding:3px 6px;border:1px solid currentColor;border-radius:0;background:transparent;color:inherit;opacity:.85}
:root[data-look="label"] .panel{gap:24px}
:root[data-look="label"] .sec{--pad:clamp(16px,2.4vw,24px);border-top:3px solid var(--ink);gap:16px}
:root[data-look="label"] .sec-head{gap:6px}
:root[data-look="label"] .help{font-size:14px;max-width:68ch}
:root[data-look="label"] .stat strong{font-size:22px}
:root[data-look="label"] select.in[data-tone]{border-bottom-color:currentColor}
:root[data-look="label"] .copy-row{padding:12px 0}
:root[data-look="label"] .grid th{padding:8px 5px}
:root[data-look="label"] .grid td{padding:5px}
:root[data-look="label"] .grid th:first-child,:root[data-look="label"] .grid td:first-child{padding-left:0}
:root[data-look="label"] .grid td.x,:root[data-look="label"] .grid th.x{padding:0 0 0 4px}
:root[data-look="label"] .auto-tag{letter-spacing:.1em}
:root[data-look="label"] .tiles{border-top:3px solid var(--ink)}
:root[data-look="label"] .tile{padding:16px 18px 18px;gap:9px}
:root[data-look="label"] .tile[data-tone="none"] strong{font-size:18px;line-height:28px}
:root[data-look="label"] .chart figcaption{font-size:14px}
:root[data-look="label"] .foot{font-size:13px}
:root[data-look="label"] dialog{border:2px solid var(--ink);padding:22px;box-shadow:none}
:root[data-look="label"] dialog h2{font:700 27px/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}

@media (max-width:900px){
  .label{grid-template-columns:1fr}
  :root:not([data-look="label"]) .label-side > .lcell:last-child{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line)}
  :root[data-look="label"] .label-main{border-right:0;border-bottom:2px solid var(--label-ink)}
  :root[data-look="label"] .label-side{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  :root[data-look="label"] .label-side > .lcell + .lcell{border-top:0;border-left:2px solid var(--label-ink)}
}
@media (max-width:820px){
  .copy-head{display:none}
  .copy-row{grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
  .copy-name,.copy-body{grid-column:1 / -1}
  .copy-left,.copy-status{padding-top:0}
  .copy-name label{padding-top:0}
}
@media (max-width:620px){
  :root:not([data-look="label"]) .lrow-id > .lcell:first-child,
  :root:not([data-look="label"]) .lrow-id > .lcell:last-child{grid-column:span 12}
  :root:not([data-look="label"]) .lrow-sku > .lcell:first-child,
  :root:not([data-look="label"]) .meta > div{grid-column:span 6}
  :root[data-look="label"] :is(.lrow-id,.lrow-sku,.label-side){grid-template-columns:1fr}
  :root[data-look="label"] .lrow > .lcell + .lcell,:root[data-look="label"] .label-side > .lcell + .lcell{border-left:0;border-top:2px solid var(--label-ink)}
  :root[data-look="label"] .tab{font-size:18px;padding:11px 12px 9px}
  :root[data-look="label"] .brand h1{font-size:28px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}

/* workbook-specific */
.figs{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.figs li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:13px;line-height:1.3}
.figs li span{color:var(--ink-2)}
.figs b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.figs b[data-tone="bad"]{color:var(--bad)}
.figs b[data-tone="warn"]{color:var(--warn)}
.state{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px}
.state p{margin:0;max-width:80ch}
.linked{font-size:12.5px;color:var(--ink-2)}
.ch-line.dash{stroke-dasharray:6 5}
.ch-divider{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.ch-phase{font:600 11px var(--font-body);fill:var(--ink-2)}
.ch-bar{fill:var(--series)}
.ch-bar:hover{opacity:.85}
.ch-bar-label{font:400 12.5px var(--font-body);fill:var(--ink-2)}
.ch-val{font:600 12px var(--font-num);fill:var(--ink)}
.ch-val tspan{font-weight:400;fill:var(--ink-2)}
.plot.bars{min-height:0}
.plot.bars svg{height:auto}
.grid td .pill{min-width:0}

#foot-notes{padding:0;gap:6px}
.v[data-tone="good"]{color:var(--good);font-weight:600}
.v[data-tone="warn"]{color:var(--warn);font-weight:600}
.figs b[data-tone="good"]{color:var(--good)}
.stat strong[data-tone="bad"]{color:var(--bad)}
.stat strong[data-tone="good"]{color:var(--good)}
.top a.btn{text-decoration:none;color:var(--top-fg);border-color:var(--top-muted);background:transparent}
.top a.btn:hover{border-color:var(--top-fg)}
.grid .muted{color:var(--muted);font-size:12.5px}

</style>

<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1 id="wb-title">Advertising</h1><span>FBA workbook</span></div>
    <div class="actions">
      <a class="btn quiet" href="../index.html">All tools</a>
      <button type="button" class="btn primary" id="btn-copy">Save local copy</button>
      <button type="button" class="btn" id="btn-backup">Back up</button>
      <button type="button" class="btn" id="btn-restore">Restore</button>
      <button type="button" class="btn" id="btn-blank">Start blank</button>
    </div>
  </header>
  <noscript><p>This workbook needs JavaScript to calculate and save. Turn it on and reload the page.</p></noscript>
  <section class="label" aria-label="Business and key figures">
    <div class="label-main">
      <div class="lrow lrow-id">
        <div class="lcell"><label class="cap" for="b-brand">Brand or business</label><input class="linput" id="b-brand" type="text" autocomplete="off" placeholder="Brand name"></div>
        <div class="lcell"><label class="cap" for="b-marketplace">Marketplace</label><input class="linput" id="b-marketplace" type="text" autocomplete="off" placeholder="Amazon.com (US)"></div>
      </div>
    </div>
    <div class="label-side">
      <div class="lcell">
        <span class="cap" id="count-cap">Headline</span>
        <div class="count"><strong id="count-num"></strong><span id="count-unit"></span></div>
        <div class="count-date" id="count-date"></div>
      </div>
      <div class="lcell">
        <span class="cap">Key figures</span>
        <ul class="figs" id="figs"></ul>
      </div>
    </div>
  </section>
  <div class="notice" id="notice" hidden>
    <p id="notice-text"></p>
    <div class="notice-actions">
      <button type="button" class="btn small" id="notice-blank">Start blank</button>
      <button type="button" class="btn small" id="notice-keep">Keep this data</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Workbook tabs"></nav>
  <main></main>
  <footer class="foot">
    <p>Tinted cells are yours to fill in. Every other figure is calculated from them.</p>
    <div id="foot-notes" class="foot"></div>
    <p id="foot-save"></p>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" class="link" id="toast-act" hidden></button></div>
<dialog id="dlg" aria-labelledby="dlg-title"><h2 id="dlg-title"></h2><div id="dlg-body"></div><div class="dlg-actions" id="dlg-actions"></div></dialog>
<script>
(function () {
var U;
window.SPEC = {
  app: 'advertising',
  title: 'Advertising',
  desc: 'Plan campaign structure and budget, track weekly ACoS and TACoS against break-even, harvest search terms, and set bids from your margin.',
  notice: 'Every tab is filled with sample data for a speaker\'s Sponsored Products ads. Type over it, or start blank.',
  headCap: 'Last week',
  tones: {good: ['Live', 'Promote to exact', 'Raise'], warn: ['Paused', 'Planned', 'Lower bid', 'Lower'], bad: ['Negate']},
  notes: [
    'Break-even ACoS is your profit per unit before ads divided by the price. Below it an ad sale still makes money, above it every ad sale loses money. Target ACoS is the level you choose to run at.',
    'TACoS is ad spend over total sales, ads and organic together. Falling TACoS while ad spend holds means organic sales are growing.',
    'Target bid = price x target ACoS x conversion rate. A keyword that converts better can carry a higher bid at the same ACoS.'
  ],
  tabs: [
    {id: 'campaign-structure', title: 'Campaign structure', badge: function (D) { return D.cLive ? D.cLive + ' live' : ''; }, sections: [
      {type: 'form', title: 'Currency', fields: [{k: 'currency', label: 'Currency', kind: 'sel', options: ['$', '€', '£']}]},
      {type: 'tiles', items: [
        {label: 'Campaigns', sub: 'Rows in the plan', v: function (D, S) { return S.t.camps.length ? String(S.t.camps.length) : ''; }},
        {label: 'Daily budget', sub: 'Live and planned campaigns', v: function (D, S) { return S.t.camps.length ? U.fMoney(D.cDaily, 0) : ''; }},
        {label: 'Monthly budget', sub: 'Daily budget times 30.4', v: function (D, S) { return S.t.camps.length ? U.fMoney(D.cDaily * 30.4, 0) : ''; }},
        {label: 'Live campaigns', sub: 'Currently running', v: function (D, S) { return S.t.camps.length ? String(D.cLive) : ''; }}
      ]},
      {type: 'table', k: 'camps', title: 'Campaigns', help: 'One row per campaign. Keep one targeting type per campaign so you can read its results cleanly.', add: 'Add a campaign', cols: [
        {k: 'name', label: 'Campaign', kind: 'text', w: 190},
        {k: 'type', label: 'Ad type', kind: 'sel', options: ['Sponsored Products', 'Sponsored Brands', 'Sponsored Display'], w: 150},
        {k: 'target', label: 'Targeting', kind: 'sel', options: ['Auto', 'Exact', 'Phrase', 'Broad', 'Product targeting', 'Category'], w: 126},
        {k: 'goal', label: 'Goal', kind: 'sel', options: ['Launch', 'Rank', 'Profit', 'Defend brand', 'Research'], w: 110},
        {k: 'budget', label: 'Daily budget', kind: 'money', w: 70, foot: 'sum'},
        {k: 'bid', label: 'Default bid', kind: 'money', w: 66},
        {k: 'kws', label: 'Targets', kind: 'int', w: 60},
        {k: 'status', label: 'Status', kind: 'sel', options: ['Planned', 'Live', 'Paused'], w: 92, tone: true},
        {label: 'Share of budget', w: 70, v: function (D, i) { return U.fPct(D.camps[i]); }}
      ]},
      {type: 'charts', title: 'Budget split', charts: [
        {kind: 'bars', title: 'Daily budget by campaign', sub: 'With share of the total', data: function (D, S) { return {items: S.t.camps.filter(function (c) { return c.status !== 'Paused'; }).map(function (c) { return {label: c.name || c.target, v: c.budget}; }), fmt: 'money', share: true}; }}
      ]}
    ]},
    {id: 'ppc-performance', title: 'PPC performance', badge: function (D) { return D.last ? U.fPct(D.last.acos) : ''; }, sections: [
      {type: 'form', title: 'Targets', fields: [
        {k: 'price', label: 'Selling price', kind: 'money'},
        {k: 'profitBefore', label: 'Profit per unit before ads', kind: 'money'},
        {k: 'target', label: 'Target ACoS', kind: 'pct'}
      ], stats: [
        {label: 'Break-even ACoS', v: function (D) { return U.fPct(D.beAcos); }}
      ]},

    bar.insertBefore(h('a', {class: 'btn', href: SPEC.download.href, download: '', text: SPEC.download.label || 'Download Excel'}), copyBtn);
  }
  ['brand', 'marketplace'].forEach(function (k) {
    var el = $('b-' + k);
    el.addEventListener('input', function () { state.biz[k] = el.value; edit(); });
  });
  (SPEC.figs || []).forEach(function (fg) {
    var b = h('b');
    $('figs').appendChild(h('li', null, h('span', {text: fg.label}), b));
    ups.global.push(function () { var r = fg.v(D, state); b.textContent = textOf(r) || 'No data'; b.dataset.tone = toneIn(r) || ''; });
  });
  var hp = pill(), ht = h('span');
  $('count-date').replaceChildren(hp, ' ', ht);
  ups.global.push(function () {
    var r = SPEC.headline(D, state) || {}, num = $('count-num');
    num.hidden = r.num == null || r.num === '';
    num.textContent = r.num == null ? '' : r.num;
    $('count-unit').textContent = r.unit || '';
    setPill(hp, r.status || ''); ht.textContent = r.note || '';
  });
  ups.global.push(function () {
    SPEC.tabs.forEach(function (t) { $('badge-' + t.id).textContent = t.badge ? t.badge(D, state) || '' : ''; });
    $('notice').hidden = !state.notice;
  });
}

/* ---------- render cycle ---------- */
function currentTab() {
  var ids = SPEC.tabs.map(function (t) { return t.id; }), id = (location.hash || '').replace('#', '');
  if (ids.indexOf(id) >= 0) return id;
  try { id = localStorage.getItem(LS_KEY + ':tab'); } catch (e) { id = null; }
  return ids.indexOf(id) >= 0 ? id : ids[0];
}
function drawCharts() { var t = currentTab(); (charts[t] || []).forEach(function (fn) { fn(); }); }
function recalc() {
  D = SPEC.derive(state, todayUTC(), U);
  Object.keys(ups).forEach(function (k) { ups[k].forEach(function (fn) { fn(); }); });
  drawCharts();
}
function renderAll() {
  D = SPEC.derive(state, todayUTC(), U);
  $('b-brand').value = state.biz.brand; $('b-marketplace').value = state.biz.marketplace;
  SPEC.tabs.forEach(renderTab);
  recalc();
}
function route() {
  var id = currentTab();
  SPEC.tabs.forEach(function (t) {
    var on = t.id === id, tab = $('tab-' + t.id);
    tab.setAttribute('aria-selected', on ? 'true' : 'false'); tab.tabIndex = on ? 0 : -1;
    $('panel-' + t.id).hidden = !on;
  });
  try { localStorage.setItem(LS_KEY + ':tab', id); } catch (e) {}
  drawCharts();
}

/* ---------- toast, dialogs, files ---------- */
var toastTimer = 0;
function toast(msg, actLabel, act) {
  var t = $('toast'), b = $('toast-act');
  $('toast-text').textContent = msg;
  b.hidden = !actLabel;
  if (actLabel) { b.textContent = actLabel; b.onclick = function () { t.hidden = true; act(); }; }
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, actLabel ? 8000 : 3500);
}
function openDialog(title, body, actions) {
  var d = $('dlg'), bar = $('dlg-actions');
  $('dlg-title').textContent = title;
  $('dlg-body').replaceChildren.apply($('dlg-body'), body);
  bar.replaceChildren();
  actions.forEach(function (a) { bar.appendChild(h('button', {type: 'button', class: 'btn ' + (a.cls || ''), onclick: function () { if (!a.run || a.run() !== false) closeDialog(); }}, a.label)); });
  if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', '');
}
function closeDialog() { var d = $('dlg'); if (typeof d.close === 'function') { if (d.open) d.close(); } else d.removeAttribute('open'); }
function replaceState(next, msg) {
  var prev = state;
  next.updatedAt = Date.now(); state = next;
  flushSave(); renderAll();
  toast(msg, 'Undo', function () { state = prev; state.updatedAt = Date.now(); flushSave(); renderAll(); });
}
function slug() { return String(state.biz.brand || '').toLowerCase().replace(/[^0-9a-z]+/g, '-').replace(/^-+|-+$/g, '') || 'workbook'; }
function download(name, text, type) {
  try {
    var url = URL.createObjectURL(new Blob([text], {type: type}));
    var a = h('a', {href: url, download: name});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch (e) { return false; }
}
function backup() {
  flushSave();
  var text = JSON.stringify({app: SPEC.app, v: 1, savedAt: new Date().toISOString(), state: state}, null, 2);
  var name = SPEC.app + '-' + slug() + '-' + isoOf(todayUTC()) + '.json';
  if (download(name, text, 'application/json')) toast('Backup saved as ' + name + '.');
  else toast('This browser blocked the download.');
}
function saveCopy() {
  flushSave();
  var doc = PAGE.cloneNode(true);
  var old = doc.querySelector('#seed');
  if (old) old.remove();
  var seed = document.createElement('script');
  seed.id = 'seed'; seed.type = 'application/json';
  seed.textContent = JSON.stringify(state).replace(/</g, '\\u003c');
  var first = doc.querySelector('script');
  first.parentNode.insertBefore(seed, first);
  var name = SPEC.app + '-' + slug() + '-' + isoOf(todayUTC()) + '.html';
  if (download(name, '<!DOCTYPE html>\n' + doc.outerHTML, 'text/html')) toast('Local copy saved as ' + name + '. Open it in any browser, online or off.');
  else toast('This browser blocked the download. Use Back up instead.');
}
function restoreDialog() {
  var file = h('input', {type: 'file', id: 'restore-file', accept: '.json,application/json'});
  var ta = h('textarea', {class: 'in mono', rows: 6, id: 'restore-text', placeholder: 'Or paste backup text here'});
  var err = h('p', {class: 'err', role: 'alert', hidden: true});
  var fail = function (msg) { err.textContent = msg; err.hidden = false; return false; };
  file.addEventListener('change', function () {
    var f = file.files && file.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { ta.value = String(rd.result || ''); err.hidden = true; };
    rd.onerror = function () { fail('Could not read that file. Open it and paste its text below.'); };
    rd.readAsText(f);
  });
  openDialog('Restore from a backup', [
    h('p', {class: 'help', text: 'Restoring replaces everything in every tab with what the backup holds.'}),
    h('label', {class: 'cap', for: 'restore-file', text: 'Backup file'}), file,
    h('label', {class: 'cap', for: 'restore-text', text: 'Backup text'}), ta, err
  ], [
    {label: 'Restore', cls: 'primary', run: function () {
      var text = ta.value.trim(), parsed;
      if (!text) return fail('Choose a backup file or paste backup text first.');
      try { parsed = JSON.parse(text); } catch (e) { return fail('That text is not a complete backup.'); }
      if (!parsed || parsed.app !== SPEC.app || !parsed.state) return fail('That file is not a backup of this workbook.');
      var next = normalize(parsed.state); next.notice = false;
      replaceState(next, 'Backup restored.');
    }},
    {label: 'Cancel', cls: 'quiet'}
  ]);
}
function blankDialog() {
  openDialog('Start with a blank workbook?', [h('p', {class: 'help', text: 'This clears every entry in every tab. Back up first if you want to keep what is here.'})], [
    {label: 'Clear all entries', cls: 'danger', run: function () { replaceState(blank(), 'Workbook cleared.'); }},
    {label: 'Load the sample', cls: 'quiet', run: function () { replaceState(sampleState(), 'Sample data loaded.'); }},
    {label: 'Cancel', cls: 'quiet'}
  ]);
}

/* ---------- start ---------- */
function buildShell() {
  $('wb-title').textContent = SPEC.title;
  $('count-cap').textContent = SPEC.headCap || 'Status';
  $('notice-text').textContent = SPEC.notice || 'Every tab is filled with sample data. Type over it, or start blank.';
  var nav = $('tabs'), main = document.querySelector('main');
  SPEC.tabs.forEach(function (t) {
    nav.appendChild(h('a', {class: 'tab', role: 'tab', id: 'tab-' + t.id, href: '#' + t.id, 'aria-controls': 'panel-' + t.id}, t.title, ' ', h('small', {id: 'badge-' + t.id})));
    main.appendChild(h('div', {class: 'panel', id: 'panel-' + t.id, role: 'tabpanel', 'aria-labelledby': 'tab-' + t.id, hidden: true}));
  });
  var foot = $('foot-notes');
  (SPEC.notes || []).forEach(function (n) { foot.appendChild(h('p', {text: n})); });
}
function start() {
  if (started) return;
  started = true;
  buildShell();
  storageOK = probeStorage();
  state = pickStart();
  buildHeader();
  $('btn-copy').addEventListener('click', saveCopy);
  $('btn-backup').addEventListener('click', backup);
  $('btn-restore').addEventListener('click', restoreDialog);
  $('btn-blank').addEventListener('click', blankDialog);
  $('notice-blank').addEventListener('click', blankDialog);
  $('notice-keep').addEventListener('click', function () { state.notice = false; edit(); });
  document.querySelector('.tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var ids = SPEC.tabs.map(function (t) { return t.id; }), i = ids.indexOf(currentTab()) + (e.key === 'ArrowLeft' ? -1 : 1);
    var id = ids[(i + ids.length) % ids.length];
    e.preventDefault(); location.hash = id; $('tab-' + id).focus();
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushSave(); });
  var lastW = 0, roTimer = 0;
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function () {
    var w = document.querySelector('main').clientWidth;
    if (w === lastW) return;
    lastW = w; clearTimeout(roTimer); roTimer = setTimeout(drawCharts, 80);
  }).observe(document.querySelector('main'));
  saveNote();
  renderAll(); route();
}
window.WB_TEST = {blank: blank, sampleState: sampleState, normalize: normalize};
if (document.getElementById('app')) start();
})();

</script>
